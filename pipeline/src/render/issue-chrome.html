<!--
  ISSUE CHROME: the canonical Shipped. issue design.

  Locked 2026-08-06 to anthropic-weekly/2026-31, chosen by Eddie as the standard
  after an audit showed the three cadences had drifted into three different looks.
  Cause: three cloud routines each free-hand their HTML from template.html every
  run, and nothing enforced a shared component vocabulary, so each invented one.

  This file is the enforcement point, the same pattern as subscribe-block.html:
  paste it VERBATIM into the head. Do not retype it, do not restyle it. Editing
  the design means editing THIS file, and every cadence inherits the change.

  Consumed by pipeline/scripts/render-issue.py and by the daily, weekly and
  monthly routine prompts. Class vocabulary: pub-bar, weekly-header, open-section,
  feature-opener, prose-well, also-item, log-*, close-section, colophon.
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,300;1,9..144,400;1,9..144,500;1,9..144,700&family=Archivo:wght@300;400;500;600;700;800;900&family=Archivo+Narrow:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"><style>


*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
body{background:#FAF8F4;color:#0b0b0b;font-family:'Archivo',sans-serif;overflow-x:hidden}
::selection{background:#FF6B35;color:#fff}

:root{
  --orange:#FF6B35;
  --ink:#0b0b0b;
  --paper:#FAF8F4;
  --paper-shadow:#f2f0e8;
  --body:#2a2a2a;
  --muted:#5a5a5a;
  --gray:#8a8a8a;
  --hair:rgba(11,11,11,0.12);
  --hair-soft:rgba(11,11,11,0.06);
  --hair-hard:rgba(11,11,11,0.22);
  --disp:'Fraunces', 'Times New Roman', serif;
  --sans:'Archivo', system-ui, sans-serif;
  --narrow:'Archivo Narrow', 'Archivo', sans-serif;
  --mono:'JetBrains Mono', ui-monospace, monospace;
}

body::before{
  content:"";
  position:fixed;inset:0;pointer-events:none;z-index:1000;opacity:.28;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' seed='3'/><feColorMatrix values='0 0 0 0 0.02  0 0 0 0 0.02  0 0 0 0 0.02  0 0 0 0.22 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}

.pub-bar{
  position:sticky;top:0;z-index:100;
  background:var(--paper);
  border-bottom:1px solid var(--hair);
  padding:0 28px;height:42px;
  display:flex;align-items:center;justify-content:space-between;
  font-family:var(--narrow);
  font-size:11px;font-weight:600;letter-spacing:.22em;
  text-transform:uppercase;color:var(--ink);
}
.pub-bar-left,.pub-bar-right{display:flex;align-items:center;gap:16px}
.pub-bar-mark{font-family:var(--disp);font-weight:500;font-size:16px;letter-spacing:-.01em;text-transform:none;font-style:italic}
.pub-bar-mark .dot{color:var(--orange)}
.pub-bar-sep{width:1px;height:12px;background:var(--hair-hard)}
.pub-bar-meta{color:var(--muted)}
.pub-bar-link{color:inherit;text-decoration:none;border-bottom:1px solid currentColor;transition:color .15s ease}
.pub-bar-link:hover{color:var(--orange)}
.colophon-link{color:inherit;text-decoration:none;border-bottom:1px solid currentColor;transition:color .15s ease}
.colophon-link:hover{color:var(--orange)}
.colophon-foot .colophon-link b{color:var(--paper)}
.pub-bar-folio{color:var(--ink)}
.pub-bar-folio b{font-weight:600;color:var(--orange)}
.pub-bar-cta{
  display:inline-block;background:var(--ink);color:var(--paper);
  text-decoration:none;border:1px solid var(--ink);border-radius:10px;
  font-family:var(--narrow);font-weight:700;font-size:11px;
  letter-spacing:.2em;text-transform:uppercase;
  padding:6px 14px;transition:background .15s ease,border-color .15s ease;
}
.pub-bar-cta:hover{background:var(--orange);border-color:var(--orange);color:var(--ink)}
@media (max-width:720px){
  .pub-bar-hide-sm{display:none}
  .pub-bar{padding:0 16px}
  .pub-bar-cta{padding:5px 10px;letter-spacing:.12em}
}

.folio{
  font-family:var(--narrow);
  font-size:10px;font-weight:500;letter-spacing:.28em;
  text-transform:uppercase;color:var(--gray);
  display:flex;align-items:center;gap:10px;
}
.folio b{color:var(--ink);font-weight:700}
.folio .ruler{width:28px;height:1px;background:var(--hair-hard)}
.folio .dot{color:var(--orange)}

.section{
  position:relative;
  padding:64px 28px 40px;
  max-width:1280px;margin:0 auto;
}
.section-folio{
  display:flex;align-items:center;justify-content:space-between;
  padding-bottom:18px;
  border-bottom:1px solid var(--ink);
  margin-bottom:44px;
}
.section-folio-left{display:flex;align-items:center;gap:14px}
.section-folio-label{
  font-family:var(--narrow);
  font-size:11px;font-weight:700;letter-spacing:.28em;
  text-transform:uppercase;color:var(--ink);
}
.section-folio-sub{
  font-family:var(--disp);font-style:italic;
  font-size:13px;color:var(--muted);
}

.open-section{background:var(--paper)}
.open-grid{
  display:grid;
  grid-template-columns:repeat(12,1fr);
  gap:32px;
}
.open-lead{
  grid-column:2 / span 7;
}
.open-quote{
  font-family:var(--disp);
  font-variation-settings:"opsz" 144;
  font-weight:500;font-size:clamp(36px,5vw,72px);
  line-height:1.02;letter-spacing:-.025em;
  color:var(--ink);
  margin-bottom:36px;
  padding-bottom:28px;
  border-bottom:1px solid var(--hair-hard);
}
.open-quote em{font-style:italic;color:var(--orange);font-weight:500}
.open-prose{
  font-family:var(--disp);
  font-variation-settings:"opsz" 14;
  font-weight:400;font-size:18px;line-height:1.68;
  color:var(--body);
  max-width:620px;
}
.open-prose p{margin-bottom:22px}
.open-prose em{font-style:italic;color:var(--ink)}
.open-aside{
  grid-column:10 / span 3;
  border-top:1px solid var(--ink);
  padding-top:16px;
  font-family:var(--narrow);
  font-size:11px;font-weight:500;letter-spacing:.16em;
  text-transform:uppercase;color:var(--muted);
  line-height:1.9;
}
.open-aside b{color:var(--ink);font-weight:700}
@media(max-width:860px){
  .open-lead{grid-column:1 / -1}
  .open-aside{grid-column:1 / -1;margin-top:16px}
}

.feature-opener{
  display:grid;
  grid-template-columns:72px 1fr minmax(0,320px);
  gap:32px;
  padding:56px 28px 40px;
  max-width:1280px;margin:0 auto;
  position:relative;
  border-top:2px solid var(--ink);
}
.feature-opener::before{
  content:"";
  position:absolute;
  left:100px;top:0;bottom:0;
  width:1px;background:var(--hair);
}
.vert-label{
  position:relative;
  writing-mode:vertical-rl;
  transform:rotate(180deg);
  font-family:var(--narrow);
  font-size:13px;font-weight:700;letter-spacing:.48em;
  text-transform:uppercase;color:var(--ink);
  align-self:start;
  padding-top:12px;
  white-space:nowrap;
}
.vert-label .vert-num{
  color:var(--orange);
  font-family:var(--disp);
  font-style:italic;font-weight:500;
  letter-spacing:-.02em;
  margin-top:12px;display:inline-block;
  writing-mode:horizontal-tb;
  transform:rotate(180deg);
  font-size:20px;
}
.feature-heading{min-width:0}
.feature-kicker{
  font-family:var(--narrow);
  font-size:10px;font-weight:700;letter-spacing:.32em;
  text-transform:uppercase;color:var(--orange);
  margin-bottom:20px;
}
.feature-title{
  font-family:var(--disp);font-weight:700;
  font-variation-settings:"opsz" 144;
  font-size:clamp(52px,8vw,128px);
  line-height:.9;letter-spacing:-.042em;
  color:var(--ink);
  margin-bottom:24px;
}
.feature-title em{font-style:italic;font-weight:400;color:var(--ink)}
.feature-deck{
  font-family:var(--disp);font-weight:400;
  font-variation-settings:"opsz" 72;
  font-size:clamp(20px,2.4vw,28px);
  line-height:1.3;letter-spacing:-.01em;
  color:var(--muted);
  max-width:640px;
  margin-bottom:24px;
}
.feature-meta{
  padding-top:18px;
  border-top:1px solid var(--hair);
  font-family:var(--narrow);
  font-size:10px;font-weight:600;letter-spacing:.24em;
  text-transform:uppercase;color:var(--muted);
  line-height:1.8;
}
.feature-meta b{color:var(--ink);font-weight:700}
.feature-right{
  padding-top:28px;
  border-top:1px solid var(--hair);
  font-family:var(--disp);font-style:italic;
  font-size:15px;line-height:1.55;color:var(--muted);
}
.feature-right-label{
  display:block;
  font-family:var(--narrow);font-style:normal;
  font-size:10px;font-weight:700;letter-spacing:.28em;
  text-transform:uppercase;color:var(--ink);
  margin-bottom:10px;
}
@media(max-width:860px){
  .feature-opener{grid-template-columns:1fr;gap:16px}
  .feature-opener::before{display:none}
  .vert-label{writing-mode:horizontal-tb;transform:none;font-size:11px}
  .vert-label .vert-num{writing-mode:horizontal-tb;transform:none;margin-left:16px}
  .feature-right{grid-column:1 / -1}
}

.prose-well{
  max-width:1280px;margin:0 auto;padding:0 28px 56px;
  display:grid;grid-template-columns:72px 1fr minmax(0,320px);
  gap:32px;position:relative;
}
.prose-well::before{
  content:"";position:absolute;left:100px;top:0;bottom:0;
  width:1px;background:var(--hair);
}
.prose-marginalia{
  grid-column:1;
  font-family:var(--narrow);
  font-size:10px;font-weight:600;letter-spacing:.26em;
  text-transform:uppercase;color:var(--gray);
  writing-mode:vertical-rl;transform:rotate(180deg);
  align-self:start;padding-top:8px;
  white-space:nowrap;
}
.prose{
  grid-column:2;
  font-family:var(--disp);
  font-variation-settings:"opsz" 14;
  font-weight:400;font-size:19px;line-height:1.66;
  color:var(--body);
  max-width:640px;
}
.prose p{margin-bottom:24px}
.prose em{font-style:italic;color:var(--ink)}
.prose strong{font-weight:600;color:var(--ink)}
.prose code{
  font-family:var(--mono);font-size:.86em;
  background:var(--paper-shadow);padding:1px 6px;
  border-radius:3px;color:var(--ink);
}
.prose a{color:var(--ink);border-bottom:1px solid var(--hair-hard);text-decoration:none;transition:color .15s,border-color .15s}
.prose a:hover{color:var(--orange);border-bottom-color:var(--orange)}
.prose-aside{
  grid-column:3;
  font-family:var(--narrow);
  font-size:11px;font-weight:500;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);
  border-top:1px solid var(--ink);padding-top:14px;
  line-height:1.8;
}
.prose-aside b{color:var(--ink);font-weight:700}

.drop-cap::first-letter{
  font-family:var(--disp);
  font-variation-settings:"opsz" 144;
  font-weight:700;
  font-size:9.2em;
  float:left;line-height:.78;
  padding:.02em 12px 0 0;
  margin:.02em 4px -.1em -2px;
  color:var(--ink);
}
.drop-cap-orange::first-letter{
  color:var(--orange);
}

@media(max-width:860px){
  .prose-well{grid-template-columns:1fr;padding-left:20px;padding-right:20px}
  .prose-well::before{display:none}
  .prose-marginalia{display:none}
  .prose{grid-column:1}
  .prose-aside{grid-column:1;margin-top:20px}
  .drop-cap::first-letter{font-size:6.6em}
}

.quiet-section{
  max-width:1280px;margin:0 auto;padding:64px 28px 24px;
  display:grid;grid-template-columns:repeat(12,1fr);gap:24px;
}
.quiet-head{
  grid-column:1 / span 3;
}
.quiet-title{
  font-family:var(--disp);font-style:italic;font-weight:400;
  font-variation-settings:"opsz" 72;
  font-size:32px;line-height:1;letter-spacing:-.02em;
  color:var(--ink);
}
.quiet-title em{color:var(--orange);font-style:normal;font-weight:500}
.quiet-kicker{
  font-family:var(--narrow);
  font-size:10px;font-weight:700;letter-spacing:.32em;
  text-transform:uppercase;color:var(--muted);
  margin-bottom:10px;
}
.quiet-body{
  grid-column:5 / -1;
  font-family:var(--disp);font-size:17px;line-height:1.65;color:var(--body);
  padding-left:24px;border-left:1px solid var(--ink);
}
.quiet-body p{margin-bottom:16px}
.quiet-body strong{font-weight:600;color:var(--ink)}
@media(max-width:860px){
  .quiet-head,.quiet-body{grid-column:1 / -1}
  .quiet-body{padding-left:0;border-left:none;border-top:1px solid var(--ink);padding-top:18px}
}

.close-section{
  background:var(--ink);color:var(--paper);
  padding:120px 28px 140px;
  position:relative;
  text-align:center;
}
.close-kicker{
  font-family:var(--narrow);
  font-size:11px;font-weight:700;letter-spacing:.38em;
  text-transform:uppercase;color:rgba(250,250,247,.5);
  margin-bottom:48px;
}
.close-stack{
  max-width:780px;margin:0 auto;
  display:flex;flex-direction:column;gap:32px;
}
.close-line{
  font-family:var(--disp);font-weight:400;
  font-variation-settings:"opsz" 96;
  font-size:clamp(26px,3.6vw,46px);
  line-height:1.18;letter-spacing:-.018em;
  color:var(--paper);
}
.close-line em{font-style:italic;color:var(--orange);font-weight:500}
.close-final{
  font-style:italic;color:var(--orange);
  font-size:clamp(18px,2.2vw,26px);
  line-height:1.5;letter-spacing:0;
  max-width:580px;margin:0 auto;
  font-variation-settings:"opsz" 36;
}
.close-coda-start{
  margin-top:48px;position:relative;
}
.close-coda-start::before{
  content:"";display:block;
  width:32px;height:1px;
  background:rgba(217,107,73,.45);
  margin:0 auto 36px;
}
.close-mark{
  margin-top:72px;
  font-family:var(--disp);
  font-size:48px;color:rgba(250,250,247,.3);
  letter-spacing:.8em;
}

.log-divider{
  background:var(--paper);
  padding:96px 28px 48px;
  text-align:center;
  border-top:3px double var(--ink);
  border-bottom:1px solid var(--ink);
  max-width:1280px;margin:0 auto;
}
.log-divider-kicker{
  font-family:var(--narrow);
  font-size:11px;font-weight:700;letter-spacing:.48em;
  text-transform:uppercase;color:var(--orange);
  margin-bottom:14px;
}
.log-divider-title{
  font-family:var(--disp);font-weight:700;
  font-variation-settings:"opsz" 144;
  font-size:clamp(56px,10vw,144px);
  line-height:.9;letter-spacing:-.045em;color:var(--ink);
  margin-bottom:16px;
}
.log-divider-title em{font-style:italic;font-weight:400}
.log-divider-sub{
  font-family:var(--disp);font-style:italic;
  font-size:18px;color:var(--muted);max-width:640px;margin:0 auto;line-height:1.5;
}

.log-section{
  padding:48px 28px;max-width:1280px;margin:0 auto;
}
.log-cat-head{
  display:grid;
  grid-template-columns:1fr auto;
  gap:24px;align-items:baseline;
  padding-bottom:18px;
  border-bottom:1px solid var(--ink);
  margin-bottom:0;
}
.log-cat-name{
  font-family:var(--disp);font-weight:600;font-style:italic;
  font-variation-settings:"opsz" 96;
  font-size:clamp(36px,5vw,56px);
  letter-spacing:-.02em;color:var(--ink);line-height:1;
}
.log-cat-count{
  font-family:var(--narrow);
  font-size:10px;font-weight:600;letter-spacing:.28em;
  text-transform:uppercase;color:var(--muted);
  text-align:right;
}
.log-cat-count b{color:var(--ink);font-weight:700;font-size:13px;display:block}

.log-cat-deck{
  font-family:var(--disp);
  font-style:italic;
  font-weight:400;
  font-variation-settings:"opsz" 24;
  font-size:18px;
  line-height:1.45;
  color:var(--muted);
  margin-top:14px;
  margin-bottom:8px;
  max-width:760px;
  letter-spacing:-.005em;
}
.log-cat-deck b{color:var(--ink);font-weight:600;font-style:normal}
.log-cat-deck em{color:var(--orange);font-style:normal;font-weight:500}

.log-entries{display:flex;flex-direction:column}
.log-entry{
  padding:24px 0;
  border-bottom:1px solid var(--hair);
  display:grid;
  grid-template-columns:120px 1fr;gap:28px;
}
.log-entry-left{
  display:flex;flex-direction:column;gap:8px;
}
.log-entry-date{
  font-family:var(--narrow);
  font-size:10px;font-weight:700;letter-spacing:.22em;
  text-transform:uppercase;color:var(--ink);
  font-variant-numeric:tabular-nums;
}
.log-tag{
  font-family:var(--narrow);
  font-size:9px;font-weight:700;letter-spacing:.22em;
  text-transform:uppercase;padding:3px 7px;
  display:inline-block;line-height:1.3;width:fit-content;
}
.log-tag.model{background:var(--orange);color:var(--paper)}
.log-tag.api{background:var(--ink);color:var(--paper)}
.log-tag.code{background:#3a3a3a;color:var(--paper)}
.log-tag.apps{background:#5a5a5a;color:var(--paper)}
.log-tag.sdk-py,.log-tag.sdk-ts{background:var(--paper);color:var(--ink);border:1px solid var(--ink)}
.log-tag.research,.log-tag.news{background:var(--paper);color:var(--muted);border:1px solid var(--hair-hard)}
.log-tag.deprecation{background:var(--paper-shadow);color:var(--muted);border:1px solid var(--hair-hard)}
.log-entry-title{
  font-family:var(--disp);font-weight:500;
  font-variation-settings:"opsz" 72;
  font-size:20px;letter-spacing:-.012em;
  color:var(--ink);line-height:1.25;
  margin-bottom:10px;
}
.log-entry-title a{color:inherit;text-decoration:none;border-bottom:1px solid var(--hair-hard)}
.log-entry-title a:hover{border-bottom-color:var(--orange);color:var(--orange)}
.log-entry-body{
  font-family:var(--sans);font-size:14.5px;line-height:1.6;color:var(--body);
  margin-bottom:12px;
}
.log-entry-how{
  font-family:var(--sans);font-size:13.5px;line-height:1.6;color:var(--muted);
  padding-top:12px;border-top:1px solid var(--hair-soft);
}
.log-entry-how b{font-family:var(--narrow);font-size:10px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--ink);display:block;margin-bottom:6px}
.log-entry-how code{font-family:var(--mono);font-size:.86em;background:var(--paper-shadow);padding:1px 6px;border-radius:3px;color:var(--ink)}
.log-entry-why{
  font-family:var(--disp);font-style:italic;
  font-size:14px;color:var(--muted);line-height:1.55;
  margin-top:10px;padding-left:14px;
  border-left:2px solid var(--orange);
}
.log-entry-why b{font-style:normal;font-family:var(--narrow);font-size:10px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--orange);display:block;margin-bottom:4px}

@media(max-width:720px){
  .log-entry{grid-template-columns:1fr;gap:12px}
  .log-cat-head{grid-template-columns:auto 1fr}
  .log-cat-count{grid-column:1 / -1;text-align:left;padding-top:8px;border-top:1px solid var(--hair)}
}

.colophon{
  background:var(--ink);color:var(--paper);
  padding:80px 28px 64px;
  border-top:2px solid var(--orange);
}
.colophon-inner{
  max-width:1280px;margin:0 auto;
  display:grid;grid-template-columns:repeat(12,1fr);gap:32px;
}
.colophon-mast{
  grid-column:1 / span 5;
}
.colophon-word{
  font-family:var(--disp);font-weight:500;
  font-variation-settings:"opsz" 144;
  font-size:clamp(72px,10vw,120px);
  line-height:.9;letter-spacing:-.04em;color:var(--paper);
}
.colophon-word .dot{color:var(--orange)}
.colophon-tag{
