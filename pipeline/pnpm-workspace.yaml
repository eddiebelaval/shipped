# pnpm 11 blocks dependency build scripts until each is explicitly approved.
# It scaffolded this file with a placeholder ("set this to true or false"),
# which is not a boolean, so `pnpm install` exited 1 on every run. Under
# `set -euo pipefail` that killed scripts/nightly-check.sh, which had therefore
# not run since 2026-05-23. Resolved 2026-08-03.
#
# esbuild arrives transitively via tsx. Its postinstall links the correct
# platform-native binary; without it tsx cannot run at all.
allowBuilds:
  esbuild: true

# pnpm 11+ reads overrides here, not from package.json "pnpm.overrides".
# gray-matter@4.0.3 pins js-yaml ^3.13.1 (3.14.2 carries 3 high + 1 moderate DoS CVEs).
overrides:
  js-yaml: 3.15.2
